<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml" lang="pt">
<body>

<div th:fragment="header">
    <header class="fixed-top">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container container-fluid">

                <a class="navbar-brand" href="/">
                    <img th:src="@{/images/logo.png}" th:alt="#{app.title}" width="30" height="24">
                    <span th:text="#{app.title}"></span>
                </a>

                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="offcanvas"
                        data-bs-target="#offcanvasNav"
                        aria-controls="offcanvasNav"
                        aria-expanded="false"
                        aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="nav nav-pills w-100">

                        <li class="nav-item">
                            <a class="nav-link"
                               th:classappend="${currentUri == '/' ? 'active' : ''}"
                               th:aria-current="${currentUri == '/' ? 'page' : ''}"
                               href="/">Home</a>
                        </li>
                        <li class="nav-item" sec:authorize="isAuthenticated()">
                            <a class="nav-link"
                               th:classappend="${currentUri == '/npcs' ? 'active' : ''}"
                               th:aria-current="${currentUri == '/npcs' ? 'page' : ''}"
                               href="/npcs"
                               th:text="#{app.menu.npcs}"></a>
                        </li>
                        <li class="nav-item" sec:authorize="isAuthenticated()">
                            <a class="nav-link"
                               th:classappend="${currentUri == '/monsters' ? 'active' : ''}"
                               th:aria-current="${currentUri == '/monsters' ? 'page' : ''}"
                               href="/monsters"
                               th:text="#{app.menu.monsters}"></a>
                        </li>
                        <li class="nav-item" sec:authorize="isAuthenticated()">
                            <a class="nav-link"
                               th:classappend="${currentUri == '/taverns' ? 'active' : ''}"
                               th:aria-current="${currentUri == '/taverns' ? 'page' : ''}"
                               href="/taverns"
                               th:text="#{app.menu.taverns}"></a>
                        </li>
                        <li class="nav-item" sec:authorize="isAuthenticated()">
                            <a class="nav-link"
                               th:classappend="${currentUri == '/quests' ? 'active' : ''}"
                               th:aria-current="${currentUri == '/quests' ? 'page' : ''}"
                               href="/quests"
                               th:text="#{app.menu.quests}"></a>
                        </li>

                        <li class="nav-item dropdown ms-auto">
                            <a class="nav-link dropdown-toggle"
                               href="#"
                               role="button"
                               data-bs-toggle="dropdown"
                               aria-expanded="false"
                               th:text="${#locale.getDisplayName()}">
                            </a>

                            <ul class="dropdown-menu locale-menu">
                                <li th:if="${#locale.language != 'pt_BR'}">
                                    <a class="dropdown-item locale-switcher"
                                       href="#"
                                       data-lang="pt_BR"
                                       th:text="#{app.language.portuguese}"></a>
                                </li>
                                <li th:if="${#locale.language != 'en_US'}">
                                    <a class="dropdown-item locale-switcher"
                                       href="#"
                                       data-lang="en_US"
                                       th:text="#{app.language.english}"></a>
                                </li>
                            </ul>
                        </li>

                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle"
                               href="#"
                               id="theme-dropdown"
                               role="button"
                               data-bs-toggle="dropdown"
                               aria-expanded="false">
                                <i class="bi bi-circle-half"></i> </a>

                            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="theme-dropdown">
                                <li>
                                    <button type="button" class="dropdown-item theme-switcher" data-theme="light">
                                        <i class="bi bi-sun"></i> <span th:text="#{app.theme.light}"></span>
                                    </button>
                                </li>
                                <li>
                                    <button type="button" class="dropdown-item theme-switcher" data-theme="dark">
                                        <i class="bi bi-moon-stars"></i> <span th:text="#{app.theme.dark}"></span>
                                    </button>
                                </li>
                                <li>
                                    <button type="button" class="dropdown-item theme-switcher" data-theme="auto">
                                        <i class="bi bi-laptop"></i> <span th:text="#{app.theme.system}"></span>
                                    </button>
                                </li>
                            </ul>
                        </li>

                        <!-- Usuário logado -->
                        <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                            <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="userDropdown"
                               role="button" data-bs-toggle="dropdown" aria-expanded="false">

                                <img th:src="${#authentication.principal.attributes['picture']}"
                                     alt="Avatar"
                                     class="rounded-circle me-2"
                                     style="width: 32px; height: 32px; object-fit: cover;">

                                <span th:text="${#authentication.principal.attributes['name']}"></span>
                            </a>

                            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                                <li class="dropdown-header">
                                    <small th:text="${#authentication.principal.attributes['email']}"></small>
                                </li>
                                <li><hr class="dropdown-divider"></li>
                                <li>
                                    <form th:action="@{/logout}" method="post">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <button type="submit" class="dropdown-item">Logout</button>
                                    </form>
                                </li>
                            </ul>
                        </li>

                        <!-- Usuário não logado -->
                        <li class="nav-item" sec:authorize="isAnonymous()">
                            <a role="button" class="nav-link" data-bs-toggle="modal" data-bs-target="#loginModal">Login</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasNav" aria-labelledby="offcanvasNavLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasNavLabel" th:text="#{app.title}">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="nav nav-pills flex-column gap-1">

                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link"
                       th:classappend="${currentUri == '/' ? 'active' : ''}"
                       th:aria-current="${currentUri == '/' ? 'page' : ''}"
                       href="/">Home</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link"
                       th:classappend="${currentUri == '/npcs' ? 'active' : ''}"
                       th:aria-current="${currentUri == '/npcs' ? 'page' : ''}"
                       href="/npcs"
                       th:text="#{app.menu.npcs}"></a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link"
                       th:classappend="${currentUri == '/monsters' ? 'active' : ''}"
                       th:aria-current="${currentUri == '/monsters' ? 'page' : ''}"
                       href="/monsters"
                       th:text="#{app.menu.monsters}"></a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link"
                       th:classappend="${currentUri == '/taverns' ? 'active' : ''}"
                       th:aria-current="${currentUri == '/taverns' ? 'page' : ''}"
                       href="/taverns"
                       th:text="#{app.menu.taverns}"></a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link"
                       th:classappend="${currentUri == '/quests' ? 'active' : ''}"
                       th:aria-current="${currentUri == '/quests' ? 'page' : ''}"
                       href="/quests"
                       th:text="#{app.menu.quests}"></a>
                </li>

                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle"
                       href="#"
                       role="button"
                       data-bs-toggle="dropdown"
                       aria-expanded="false">
                        <i class="bi bi-translate"></i> <span th:text="${#locale.getDisplayName()}"></span>
                    </a>
                    <ul class="dropdown-menu locale-menu">
                        <li th:if="${#locale.language != 'pt_BR'}">
                            <a class="dropdown-item locale-switcher"
                               href="#"
                               data-lang="pt_BR"
                               th:text="#{app.language.portuguese}"></a>
                        </li>
                        <li th:if="${#locale.language != 'en_US'}">
                            <a class="dropdown-item locale-switcher"
                               href="#"
                               data-lang="en_US"
                               th:text="#{app.language.english}"></a>
                        </li>
                    </ul>
                </li>

                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle"
                       href="#"
                       role="button"
                       data-bs-toggle="dropdown"
                       aria-expanded="false">
                        <i class="bi bi-circle-half"></i>
                    </a>
                    <ul class="dropdown-menu" id="theme-menu-offcanvas">
                        <li>
                            <button type="button" class="dropdown-item theme-switcher" data-theme="light">
                                <i class="bi bi-sun"></i> <span th:text="#{app.theme.light}"></span>
                            </button>
                        </li>
                        <li>
                            <button type="button" class="dropdown-item theme-switcher" data-theme="dark">
                                <i class="bi bi-moon-stars"></i> <span th:text="#{app.theme.dark}"></span>
                            </button>
                        </li>
                        <li>
                            <button type="button" class="dropdown-item theme-switcher" data-theme="auto">
                                <i class="bi bi-laptop"></i> <span th:text="#{app.theme.system}"></span>
                            </button>
                        </li>
                    </ul>
                </li>

                <!-- Usuário logado -->
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="userDropdown"
                       role="button" data-bs-toggle="dropdown" aria-expanded="false">

                        <img th:src="${#authentication.principal.attributes['picture']}"
                             alt="Avatar"
                             class="rounded-circle me-2"
                             style="width: 32px; height: 32px; object-fit: cover;">

                        <span th:text="${#authentication.principal.attributes['name']}"></span>
                    </a>

                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                        <li class="dropdown-header">
                            <small th:text="${#authentication.principal.attributes['email']}"></small>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="dropdown-item">Logout</button>
                            </form>
                        </li>
                    </ul>
                </li>

                <!-- Usuário não logado -->
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a role="button" class="nav-link" data-bs-toggle="modal" data-bs-target="#loginModal">Login</a>
                </li>
            </ul>
        </div>
    </div>

    <!-- Modal de Login -->
    <div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Faça login para continuar</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body text-center">

                    <p>Use sua conta do Google:</p>

                    <a href="/oauth2/authorization/google" class="btn btn-outline-danger w-100">
                        <img src="https://www.svgrepo.com/show/355037/google.svg"
                             width="20" class="me-2">
                        Entrar com Google
                    </a>

                </div>

            </div>
        </div>
    </div>

</div>

<div th:fragment="footer">
    <footer>
        <div class="text-center mt-4 mb-5">
            <p>&copy; <span th:text="${#dates.year(#dates.createNow())}"></span> - D&D Spirit</p>
            <a href="https://www.patreon.com/dndspirit" target="_blank" rel="noopener noreferrer">
                <img src="https://c5.patreon.com/external/logo/become_a_patron_button.png" alt="Apoie no Patreon">
            </a>
        </div>
    </footer>
</div>

</body>
</html>
