<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: base(
          pageTitle='Gerador de Quests',
          content=~{::content},
          headExtra=~{}
      )}">
<body>
<th:block th:fragment="content">

    <div class="container">

        <h1 class="mb-3">🍺 Gerador de Quests</h1>
        <a href="/quests" class="btn btn-primary mb-4">Gerar Nova Quest</a>

        <div class="card text-light p-3">

            <h2 th:text="${quest.title}" class="mb-2"></h2>

            <span class="badge bg-warning text-dark m-1" th:text="${quest.difficulty}"></span>
            <span class="badge bg-info text-dark" th:text="${quest.type}"></span>

            <hr>

            <p><strong>Gancho:</strong> <span th:text="${quest.hook}"></span></p>
            <p><strong>Local:</strong> <span th:text="${quest.location}"></span></p>
            <p><strong>Objetivo:</strong> <span th:text="${quest.objective}"></span></p>
            <p><strong>Complicação:</strong> <span th:text="${quest.complication}"></span></p>
            <p><strong>Recompensa:</strong>
                <span th:each="item : ${quest.reward}">
                    <i th:class="${item.iconClass}"></i>
                    <span th:text="#{item.__${item.name}__}"></span>
                    <span th:text="${item.quantity > 1} ? ' (' + ${item.quantity} + ')' : ''">
                    </span>
                </span>
            </p>

            <hr>

            <h5>NPCs Envolvidos</h5>
            <ul>
                <li th:each="npc : ${quest.keyNPCs}" th:text="${npc}"></li>
            </ul>

            <h5>Facções</h5>
            <ul>
                <li th:each="fac : ${quest.factionsInvolved}" th:text="${fac}"></li>
            </ul>

            <h5>Monstros sugeridos</h5>
            <ul>
                <li th:each="monster : ${quest.suggestedMonsters}">
                    <a href="javascript:void(0)"
                       th:text="#{monster.name.__${monster.name()}__}"
                       th:attr="data-monster-id=${monster.index}"
                       class="monster-link">
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <th:block th:replace="~{fragments/monster-modal :: monster-modal}"></th:block>

</th:block>
</body>
