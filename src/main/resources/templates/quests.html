<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: base(
          pageTitle='Gerador de Quests',
          content=~{::content},
          headExtra=~{}
      )}">
<body>
<th:block th:fragment="content">
    <div class="container mt-4">
        <div class="row text-center mb-4">
            <h1>
                🍺 <span th:text="#{app.quests.title}"></span>
            </h1>
        </div>

        <a href="/quests" class="btn btn-primary mb-4" th:text="#{app.quests.button}"></a>

        <div class="card shadow p-4 mb-4">
            <div class="row g-3">
                <h2 th:text="#{tavern.quest.__${quest.id}__.title}" class="mb-2"></h2>

                <span class="badge bg-warning text-dark m-1" th:text="${quest.difficulty}"></span>
                <span class="badge bg-info text-dark" th:text="${quest.type}"></span>

                <hr>

                <p><strong th:text="#{app.quests.summary}"></strong>: <span th:text="#{tavern.quest.__${quest.id}__.summary}"></span></p>
                <p><strong th:text="#{app.quests.description}"></strong>: <span th:text="#{tavern.quest.__${quest.id}__.description}"></span></p>
                <p><strong th:text="#{app.quests.location}"></strong>: <span th:text="#{tavern.quest.__${quest.id}__.location}"></span></p>
                <p><strong th:text="#{app.quests.hooks}"></strong>: <span th:text="#{tavern.quest.__${quest.id}__.hooks}"></span></p>
                <p><strong th:text="#{app.quests.complications}"></strong>: <span th:text="${quest.complication}"></span></p>
                <p><strong th:text="#{app.quests.rewards}"></strong>:
                    <span th:each="item : ${quest.reward}">
                        <i th:class="${item.iconClass}"></i>
                        <span th:text="#{item.__${item.name}__}"></span>
                        <span th:text="${item.quantity > 1} ? ' (' + ${item.quantity} + ')' : ''">
                        </span>
                    </span>
                </p>

                <hr>

                <h5 th:text="#{app.quests.npc_involved}"></h5>
                <ul>
                    <li th:each="npc : ${quest.keyNPCs}">
                        <span th:text="${npc}"></span>
                    </li>
                </ul>

                <h5 th:text="#{app.quests.factions_involved}"></h5>
                <ul>
                    <li th:each="fac : ${quest.factionsInvolved}">
                        <span th:text="${fac}"></span>
                    </li>
                </ul>

                <h5 th:text="#{app.quests.suggested_monsters}"></h5>
                <ul>
                    <li th:each="monster : ${quest.suggestedMonsters}">
                        <a href="javascript:void(0)"
                           th:text="#{monster.name.__${monster.name()}__}"
                           th:attr="data-monster-id=${monster.index}"
                           class="monster-link">
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <th:block th:replace="~{fragments/monster-modal :: monster-modal}"></th:block>

</th:block>
</body>
