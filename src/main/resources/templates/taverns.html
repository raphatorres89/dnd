<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: base(
          pageTitle='Gerador de Tavernas',
          content=~{::content},
          headExtra=~{}
      )}">
<body>
<th:block th:fragment="content">

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card p-4 mb-4">
                <form action="/taverns" method="GET">
                    <div class="row g-3 align-items-center">

                        <!-- Label -->
                        <div class="col-12 col-md-auto">
                            <label for="cuisineFilter" class="form-label mb-0 me-md-3">
                                <span th:text="#{app.taverns.filter.label}"></span>
                            </label>
                        </div>

                        <!-- Select -->
                        <div class="col-12 col-md">
                            <select id="cuisineFilter" name="cuisine" class="form-select">
                                <option value="" th:text="#{app.taverns.filter.any}"
                                        th:selected="${selectedCuisine == null or selectedCuisine == ''}">
                                </option>

                                <option th:each="cuisine : ${cuisines}"
                                        th:value="${cuisine}"
                                        th:text="#{tavern.cuisine.__${cuisine}__}"
                                        th:selected="${selectedCuisine == cuisine.name()}">
                                </option>
                            </select>
                        </div>

                        <!-- Button -->
                        <div class="col-12 col-md-auto">
                            <button type="submit" class="btn btn-primary text-white w-100 w-md-auto py-2 px-4"
                                    th:text="#{app.taverns.filter.button}">
                            </button>
                        </div>

                    </div>
                </form>
            </div>

            <h1 class="text-center mb-4">
                <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" class="icon-h1">
                    <path fill="currentColor" d="M105 41v96h30V41zm272 0v98h30V41zM25 57v30h62V57zm128 0v30h206V57zm272 0v30h62V57zM69 137v99l56.8 14.2L69 265.7v126.1c14.39-3.5 29.01-1.7 42.7 3.4 17.9 6.5 34.9 18 51.6 30.1 33.4 24.3 65.9 50.3 92.7 50.3 26.8 0 59.3-26 92.7-50.3 16.7-12.1 33.7-23.6 51.6-30.1 13.7-5.1 28.3-6.9 42.7-3.4v-42.6l-15.4-10.7-28.2-19.6L443 323V220.4l-45.7-14.5 45.7-9.5V137h-18v20h-66v-20H153v18H87v-18zm184.3 30H253.6c14.9.5 22.8 11.9 26.5 15.5 1.9 1.9 1.8 1.6 2.1 1.6 5.5-2.5 6.8-3.7 11.3-7.7h3.4c10 0 18.8 5.3 24.7 12.8 5.9 7.5 9.2 17.4 9.2 28.1 0 3.9-.4 7.6-1.3 11.2 4.1-1.5 8.1-2.7 12.2-2.9 1.5-.2 2.9-.1 4.3.1 5.9.6 12.7 5.2 14.6 11.7 10.3 34.2 7.7 71.4.1 100.8-2.7 10.6-10.6 17.6-18.6 20.3-4.5 1.5-8.9 2.1-13.1 2.4-.2 2 0 32.6 0 50.1H183c-.1-17.9 0-34.7 0-52 3.5-30.3 8.9-71.6 12.6-104.5-13.1-6.2-22.3-18.8-22.3-33.7 0-21.2 18.7-37.8 40.6-37.8 4.1 0 8.2.6 12 1.8 6.3-10.5 15.9-17.8 27.4-17.8zm-.1 18c-4.7.1-10.7 4.3-14.5 14.4l-3.6 9.7-9.1-5c-3.6-2-7.9-3.1-12.1-3.1-13.1 0-22.6 9.2-22.6 19.8 0 10.6 9.5 19.8 22.6 19.8 5.4 0 10.6-1.7 14.5-4.6l7.9-5.9 5.2 8.4c3.8 6.3 8.1 8.5 11.8 8.5 4.7 0 10.8-4.3 14.7-14.6l6.9-18.5 9.4 17.3c3.5 6.3 8.1 9 12.6 9 3.7 0 7.3-1.9 10.5-5.9 3.1-4 5.4-10.1 5.4-17s-2.3-13-5.4-17c-2.4-3-5-4.8-7.8-5.6-5.6 4.4-10.8 7.1-16.5 7.4-6.7.3-12.2-3.5-15.5-6.6-6.4-6.2-8.1-10.2-14.4-10.5zm90.4 58.6c-9.9 1.2-19.7 7.5-26.9 13.2l9.6 86.1c3.9-.2 7.5-.6 10-1.5 3.9-1.3 5.6-2.3 7-7.6 6.8-26.5 8.9-60.6.3-90.2zm-65.6 7.6c-6.2 8.3-14.7 13.8-24.7 13.8-8.4 0-16-3.9-21.9-10.2-5.5 2.5-11.5 3.8-17.5 3.8h-.6L202.1 359h107.8l-11.2-100.9c-.6.1-1.2.1-1.8.1-7 0-13.5-2.6-18.9-7zM201 377v16h110v-16z"/></svg>
                <span th:text="#{${'tavern.name.' + tavern.name}}"></span>
            </h1>

            <hr class="hr-light my-4">

            <div class="row mb-4">
                <div class="col-md-6">
                    <p class="mb-1"><strong th:text="#{app.taverns.owner}"></strong>: <span th:text="#{tavern.owner.name.__${tavern.owner}__}"></span></p>
                </div>
                <div class="col-md-6">
                    <p class="mb-1"><strong th:text="#{app.taverns.trait}"></strong>: <span th:text="#{tavern.owner.trait.__${tavern.owner}__}"></span></p>
                </div>
                <div class="col-md-12 pt-2">
                    <p class="mb-1"><strong th:text="#{app.taverns.specialty}"></strong>: <span th:text="#{tavern.specialty.__${tavern.specialty}__}"></span></p>
                </div>
            </div>

            <h2 class="mt-4">📋 <span th:text="#{app.taverns.menu}"></span></h2>
            <ul class="list-group mb-4">
                <li class="list-group-item d-flex justify-content-between align-items-center"
                    th:each="entry : ${tavern.menu}">

                    <div class="d-flex align-items-center">
                        <i th:class="${entry.item().cuisineType.getIconClass()} + ' me-2'"></i>

                        <span th:text="#{tavern.food.__${entry.item()}__}" class="me-auto"></span>
                    </div>

                    <span class="badge rounded-pill" th:classappend="${entry.item().priceUnit.getColor()}">
                        <span th:text="${entry.price()}"></span>
                        <span th:text="#{money.__${entry.item().priceUnit.name()}__}"></span>
                    </span>
                </li>
            </ul>

            <h2 class="mt-4">🗣️ <span th:text="#{app.taverns.rumors}"></span></h2>
            <div class="list-group mb-4">
                <div class="list-group-item" th:each="rumor : ${tavern.rumors}">
                    <p class="mb-1" th:text="#{tavern.rumor.__${rumor.rumor()}__}"></p>
                    <small class="fst-italic fw-lighter">Contado por: <span th:text="#{tavern.rumor.source.__${rumor.source()}__}"></span></small>
                </div>
            </div>

            <h2 class="mt-4">⚔️ <span th:text="#{app.taverns.mural}"></span></h2>
            <ul class="list-group">
                <li class="list-group-item" th:each="quest : ${tavern.quests}">
                    <a th:href="${'/quests/' + quest.name()}" th:text="#{tavern.quest.__${quest}__}" target="_blank"></a>
                </li>
            </ul>
        </div>
    </div>
</div>

</th:block>
</body>
