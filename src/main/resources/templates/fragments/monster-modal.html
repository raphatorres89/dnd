<th:block th:fragment="monster-modal">
    <!-- Modal -->
    <div class="modal fade" id="monsterDetailModal" tabindex="-1" aria-labelledby="monsterDetailModalLabel">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="monsterDetailModalLabel" th:text="#{app.monsters.modal.title}"></h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="monsterDetails">
                        <span class="text-muted">Carregando...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <style>
        /* BACKDROP BLUR */
        .zoom-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            opacity: 0;
            transition: opacity .2s;
            z-index: 9998;
        }
        .zoom-backdrop.active {
            opacity: 1;
        }

        .zoom-image {
            position: fixed;
            top: 50%;
            left: 50%;
            max-width: 90vw;
            max-height: 90vh;
            transform: translate(-50%, -50%) scale(0.6);
            transition: transform .2s;
            z-index: 9999;
            border-radius: 6px;
        }
        .zoom-image.active {
            transform: translate(-50%, -50%) scale(1);
        }

        .zoom-close-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            opacity: 0;
            transition: opacity .2s;
            z-index: 10000;
            color: white;
        }
        .zoom-close-btn.active {
            opacity: 1;
        }
    </style>

    <!-- Script para abrir modal -->
    <script>
        document.addEventListener("click", function(e) {
            const link = e.target.closest(".monster-link");
            if (!link) return;

            const monsterId = link.getAttribute("data-monster-id");
            openMonsterModal(monsterId);
        });

        // Agora a função pode ser reaproveitada em qualquer lugar
        function openMonsterModal(monsterId) {
            const url = '/monsters/' + monsterId;

            $('#monsterDetails').html('<span class="text-muted">Carregando...</span>');
            $('#monsterDetails').load(url, function() {
                $('#monsterDetailModal').modal('show').attr('aria-hidden', 'false');
            });
        }
    </script>

    <script>
        (function () {
            let zoomOpen = false;
            let backdrop, zoomImg, closeBtn;

            function closeZoom() {
                if (!zoomOpen) return;
                zoomOpen = false;

                backdrop.classList.remove("active");
                zoomImg.classList.remove("active");
                closeBtn.classList.remove("active");

                setTimeout(() => {
                    backdrop.remove();
                    zoomImg.remove();
                    closeBtn.remove();

                    backdrop = zoomImg = closeBtn = null;
                }, 200);

                document.removeEventListener("keydown", escClose);
            }

            function escClose(e) {
                if (e.key === "Escape") closeZoom();
            }

            document.addEventListener("click", function (e) {
                const img = e.target.closest(".monster-img");
                if (!img) return;

                e.stopPropagation(); // 🛑 evita empilhar eventos

                if (zoomOpen) {
                    closeZoom();
                    return;
                }
                zoomOpen = true;

                backdrop = document.createElement("div");
                backdrop.className = "zoom-backdrop";
                backdrop.addEventListener("click", closeZoom);
                document.body.appendChild(backdrop);

                zoomImg = document.createElement("img");
                zoomImg.src = img.src;
                zoomImg.className = "zoom-image";
                zoomImg.addEventListener("click", (ev) => ev.stopPropagation());
                document.body.appendChild(zoomImg);

                closeBtn = document.createElement("div");
                closeBtn.className = "zoom-close-btn";
                closeBtn.innerHTML = "&times;";
                closeBtn.addEventListener("click", (ev) => {
                    ev.stopPropagation(); // 🛑 evita trigger duplo
                    closeZoom();
                });
                document.body.appendChild(closeBtn);

                setTimeout(() => {
                    backdrop.classList.add("active");
                    zoomImg.classList.add("active");
                    closeBtn.classList.add("active");
                }, 10);

                document.addEventListener("keydown", escClose);
            });
        })();
    </script>
</th:block>
