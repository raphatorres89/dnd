damage.ACID=Ácido
damage.desc.ACID=O jato corrosivo do hálito de um dragão negro e as enzimas dissolventes secretadas por um pudim negro causam dano ácido.
damage.BLUDGEONING=Concussão
damage.desc.BLUDGEONING=Ataques com força bruta, quedas, constrição e similares causam dano contundente.
damage.COLD=Frio
damage.desc.COLD=O frio infernal que emana da lança de um demônio de gelo e o sopro gélido de um dragão branco causam dano de frio.
damage.FIRE=Fogo
damage.desc.FIRE=Os dragões vermelhos cospem fogo, e muitos feitiços conjuram chamas para causar dano de fogo.
damage.FORCE=Força
damage.desc.FORCE=A força é energia mágica pura concentrada numa forma destrutiva. A maioria dos efeitos que causam dano de força são feitiços, incluindo mísseis mágicos e armas espirituais.
damage.LIGHTNING=Relâmpago
damage.desc.LIGHTNING=Um feitiço de raio e o sopro de um dragão azul causam dano de relâmpago.
damage.NECROTIC=Necrótico
damage.desc.NECROTIC=Dano necrótico, causado por certos mortos-vivos e feitiços como toque gelado, matéria murcha e até mesmo a alma.
damage.PIERCING=Perfurante
damage.desc.PIERCING=Ataques perfurantes e empaladores, incluindo lanças e mordidas de monstros, causam dano perfurante.
damage.POISON=Veneno
damage.desc.POISON=Picadas venenosas e o gás tóxico do sopro de um dragão verde causam dano venenoso.
damage.PSYCHIC=Psíquico
damage.desc.PSYCHIC=Habilidades mentais, como uma explosão psiônica, causam dano psíquico.
damage.RADIANT=Radiante
damage.desc.RADIANT=O dano radiante, causado pelo feitiço golpe de chama de um clérigo ou pela arma de um anjo, queima a carne como fogo e sobrecarrega o espírito com poder.
damage.SLASHING=Cortante
damage.desc.SLASHING=Espadas, machados e garras de monstros causam dano cortante.
damage.THUNDER=Trovão
damage.desc.THUNDER=Uma explosão concussiva de som, como o efeito do feitiço onda de trovão, causa dano de trovão.
damage.DAMAGE_FROM_SPELLS=Dano de Magias
damage.desc.DAMAGE_FROM_SPELLS=Magias e efeitos mágicos causam esse tipo de dano.

