# Conditions
condition.BLINDED=Cego
condition.desc.BLINDED=- Uma criatura cega não pode enxergar e falha automaticamente em testes de Sabedoria (Percepção) que dependam da visão.|- Ataques contra a criatura têm vantagem, e os ataques dela têm desvantagem.
condition.CHARMED=Encantado
condition.desc.CHARMED=- Uma criatura encantada não pode atacar o encantador nem atingi-lo com habilidades prejudiciais ou efeitos mágicos.|- O encantador tem vantagem em qualquer teste de habilidade para interagir socialmente com a criatura.
condition.DEAFENED=Ensurdecido
condition.desc.DEAFENED=- Uma criatura ensurdecida não pode ouvir e falha automaticamente em testes de Sabedoria (Percepção) que dependam da audição.
condition.EXHAUSTION=Exaustão
condition.desc.EXHAUSTION=- Algumas habilidades especiais e riscos ambientais, como fome e os efeitos a longo prazo de temperaturas extremamente baixas ou altas, podem levar a uma condição especial chamada exaustão. A exaustão é medida em seis níveis. Um efeito pode causar um ou mais níveis de exaustão a uma criatura, conforme especificado na descrição do efeito.|1 - Desvantagem em testes de habilidade|2 - Velocidade reduzida pela metade|- Desvantagem em testes de ataque e jogadas de salvamento|3 - Pontos de vida máximos reduzidos pela metade|4 - Velocidade reduzida a 0|5 - Morte|Se uma criatura já exausta sofrer outro efeito que cause exaustão, seu nível atual de exaustão aumenta na quantidade especificada na descrição do efeito.|- Uma criatura sofre o efeito de seu nível atual de exaustão, bem como de todos os níveis inferiores. Por exemplo, uma criatura que sofre exaustão de nível 2 tem sua velocidade reduzida pela metade e tem desvantagem em testes de habilidade.|- Um efeito que remove a exaustão reduz seu nível conforme especificado na descrição do efeito, com todos os efeitos de exaustão terminando se o nível de exaustão da criatura for reduzido para menos de 1.|- Terminar um descanso longo reduz o nível de exaustão da criatura em 1, desde que a criatura também tenha ingerido algum alimento e bebida.
condition.FRIGHTENED=Com Medo
condition.desc.FRIGHTENED=- Uma criatura com medo tem desvantagem em testes de habilidade e jogadas de ataque enquanto a fonte do seu medo estiver em sua linha de visão.|- A criatura não pode se mover voluntariamente para mais perto da fonte do seu medo.
condition.GRAPPLED=Agarrado
condition.desc.GRAPPLED=- Uma criatura agarrada tem sua velocidade reduzida a 0.|- O efeito termina se a criatura agarrada for removida do alcance do agarrador ou se o agarrador for incapacitado.
condition.INCAPACITATED=Incapacitado
condition.desc.INCAPACITATED=- Uma criatura incapacitada não pode agir ou reagir.
condition.INVISIBLE=Invisível
condition.desc.INVISIBLE=- Uma criatura invisível não pode ser vista sem o auxílio de magia ou de sentidos especiais. Para propósitos de ataque, uma criatura invisível é considerada como tendo cobertura total.|- Os ataques contra a criatura invisível têm desvantagem, e os ataques dela têm vantagem.
condition.PARALYZED=Paralizado
condition.desc.PARALYZED=- Uma criatura paralizada está incapacitada e não pode se mover ou falar.|- A criatura automaticamente falha em testes de Força e Destreza.|- Os ataques contra a criatura têm vantagem.|- Se o ataque vier de uma criatura a 1,5 metro da criatura paralizada, o ataque é um acerto crítico automático.
condition.PETRIFIED=Petrificado
condition.desc.PETRIFIED=- Uma criatura petrificada é transformada, junto com todo o seu equipamento, em uma substância sólida (normalmente pedra).|- A criatura é incapaz de se mover ou falar e está inconsciente.|- Os ataques contra a criatura têm vantagem.|- A criatura tem resistência a todo dano.|- A criatura é imune a veneno e doença, embora uma doença ou veneno já em efeito no momento da petrificação estejam suspensos, não curados.
condition.POISONED=Envenenado
condition.desc.POISONED=- Uma criatura envenenada tem desvantagem em jogadas de ataque e testes de habilidade.
condition.PRONE=Propenso
condition.desc.PRONE=- Uma criatura propensa tem desvantagem em jogadas de ataque.|- Um ataque corpo a corpo contra a criatura propensa tem vantagem.|- Um ataque à distância contra a criatura propensa tem desvantagem.|- A criatura pode usar metade de seu movimento para se levantar do estado propenso.
condition.RESTRAINED=Contido
condition.desc.RESTRAINED=- Uma criatura contida tem sua velocidade reduzida a 0 e não pode se beneficiar de bônus de velocidade.|- Os ataques contra a criatura têm vantagem, e os ataques dela têm desvantagem.|- A criatura tem desvantagem em testes de Destreza.|- A criatura tem resistência a todo dano físico (concussão, perfurante e cortante).
condition.STUNNED=Atordoado
condition.desc.STUNNED=- Uma criatura atordoada está incapacitada, não pode se mover e fala apenas palavras desconexas.|- A criatura automaticamente falha em testes de Força e Destreza.|- Os ataques contra a criatura têm vantagem.|- Se o ataque vier de uma criatura a 1,5 metro da criatura atordoada, o ataque é um acerto crítico automático.
condition.UNCONSCIOUS=Inconsciente
condition.desc.UNCONSCIOUS=- Uma criatura inconsciente está incapacitada, não pode se mover ou falar e está inconsciente.|- A criatura automaticamente falha em testes de Força e Destreza.|- Os ataques contra a criatura têm vantagem.|- Se o ataque vier de uma criatura a 1,5 metro da criatura inconsciente, o ataque é um acerto crítico automático.

