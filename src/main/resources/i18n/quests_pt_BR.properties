##################################################
# Quests
##################################################
quest.RAT_INFESTATION=Extermínio: Barman oferece 5 Pratas para limpar o porão de ratos gigantes e *blights* de galho.
quest.DELIVER_PACKAGE=Entrega Urgente: Entregar um pacote selado (e pesado) a um Magista recluso na Floresta Negra. Não perguntar o conteúdo.
quest.RECOVER_STOLEN_ITEM=Roubo na Loja: Recuperar um colar da sorte roubado de um vendedor por um bando de Kobolds.
quest.ESCORTE_MERCHANT=Missão de Escolta: Acompanhar um comerciante medroso por três dias de viagem na estrada principal.
quest.DEAL_WITH_BANDITS=Problema na Ponte: Um pequeno grupo de bandidos está cobrando pedágio ilegal na ponte para a cidade vizinha.
quest.INVESTIGATE_HAUNTING=Assombração na Fazenda: Um fazendeiro relata fenômenos estranhos em sua fazenda e precisa de uma investigação.
quest.CLEAR_GOBLIN_CAMP=Limpar Acampamento: Um mapa rudimentar mostra a localização de um acampamento Goblin a ser eliminado.
quest.RESCUE_CAPTIVE=Resgate na Mina: Um grupo de Duergar raptou um mineiro local. O resgate deve ser rápido.
quest.FIND_MISSING_PERSON=Pessoa Desaparecida: Um NPC (ex: O Bardo da Taverna) está desaparecido há três dias. Última pista: a Floresta Sombria.
quest.HUNT_LOCAL_MONSTER=Caça: Eliminar um animal selvagem que está atacando gado na região.
quest.MAP_FRAGMENT=Fragmento de Mapa: Um cliente tem um pedaço de um mapa antigo e oferece a chance de juntar o resto.
quest.GUARD_ARTIFACT=Proteger Artefato: Um Clérigo precisa de proteção ao transportar uma relíquia até o templo principal.
quest.TRUCE_NEGOTIATION=Negociação: Agir como mediador em uma trégua tensa entre duas tribos vizinhas.

# Dragonlance Quests
quest.DEFEND_SOLAMNIA_VILLAGE=Defesa Urgente: Aldeões de Solamnia pedem ajuda para repelir monstros que atacam à noite e ameaçam suas casas.
quest.ESCORT_SILVANESTI_REFUGEE=Fuga Silenciosa: Escoltar um elfo silvanesti ferido por trilhas perigosas até um refúgio seguro, evitando patrulhas hostis.
quest.FETCH_WAYRETH_COMPONENT=Componente Raro: Um mago precisa de um ingrediente especial das florestas de Wayreth para completar um ritual vital.
quest.INVESTIGATE_MISSING_KENDER=Kender Perdido: Um jovem kender sumiu após explorar ruínas antigas. Descubra seu paradeiro antes que seja tarde.
quest.DELIVER_MESSAGE_TO_QUALINESTI=Mensagem Secreta: Leve uma carta urgente ao conselho élfico de Qualinesti, driblando espiões e perigos na estrada.
quest.CLEAR_HOBGOBLIN_DEN=Covil Hobgoblin: Mercadores temem ataques constantes; limpe o covil e devolva a paz à rota comercial.
quest.RESCUE_PRISONER_FROM_OGRE=Resgate nas Colinas: Um ogro capturou um aldeão. Invada a caverna e traga o prisioneiro de volta em segurança.
quest.EXPLORE_OLD_TOWER_OF_HIGH_SORCERY=Segredos Antigos: Uma torre de magia abandonada guarda perigos, enigmas e artefatos esquecidos.
quest.DEFEND_TEMPLE_OF_PALADINE=Templo Sob Ataque: Cultistas e mortos-vivos ameaçam o templo de Paladine. Defenda os fiéis e a relíquia sagrada.
quest.HUNT_WHITE_DRAGON_WHELP=Filhote de Dragão: Um jovem dragão branco foi visto nas montanhas, aterrorizando vilarejos próximos.
quest.ESCORT_MAGE_TO_WAYRETH=Viagem Arcana: Proteja um mago e seu artefato durante a travessia até a Torre de Wayreth.
quest.INVESTIGATE_CURSED_FOREST=Floresta Amaldiçoada: Estranhos desaparecimentos e criaturas corrompidas rondam a mata. Descubra a fonte da maldição.
quest.RESCUE_CHILD_FROM_BLOODED_WOLVES=Salvamento Urgente: Uma criança foi levada por lobos sanguinários. Siga os rastros e resgate-a antes do anoitecer.
quest.FETCH_HEALING_HERBS_FOR_HEALER=Ervas Vitais: Um curandeiro precisa de ervas raras de um pântano perigoso para salvar vidas na vila.
quest.SOCIALIZE_AT_SOLACE_INN=Noite em Solace: Participe de um evento na Estalagem de Solace, onde rumores, alianças e intrigas se misturam.
quest.DEFEND_CARAVAN_FROM_BANDITS=Caravana em Perigo: Bandidos emboscam uma caravana de mercadores. Defenda os viajantes e seus bens.
quest.HUNT_GIANT_OWL_IN_DARKEN_WOOD=Coruja Gigante: Uma coruja monstruosa assombra a Floresta de Darken, assustando todos que passam.
quest.ESCORT_PRIESTESS_TO_XAK_TSAROTH=Missão Sagrada: Escolte uma sacerdotisa até as ruínas de Xak Tsaroth, enfrentando perigos antigos pelo caminho.
quest.INVESTIGATE_LOST_ARTIFACT_IN_ICELANDER=Artefato Perdido: Um item mágico sumiu nas terras geladas de Icelander. Enfrente o frio e recupere-o.
quest.RESCUE_ELVEN_SCOUTS=Patrulheiros em Perigo: Elfos enviados em missão sumiram em território hostil. Organize o resgate antes que seja tarde.
quest.EXPLORE_RUINS_OF_ITHINCART=Ruínas Esquecidas: Explore Ithincart em busca de relíquias e segredos protegidos por monstros e magia antiga.
quest.DEFEND_TOWN_FROM_BLACK_DRAGON=Dragão à Solta: Um dragão negro e seus servos atacam a cidade. Organize a defesa e salve os moradores.
quest.HUNT_MINOTAUR_GLADIATOR=Gladiador Fugitivo: Um minotauro escapou das arenas e aterroriza vilarejos. Capture ou derrote a fera.
quest.ESCORT_KNIGHT_TO_HIGHCLERIC_TOWER=Escolta Honrada: Um cavaleiro precisa chegar à Torre do Alto Clérigo em segurança, enfrentando emboscadas.
quest.INVESTIGATE_SHADOWS_IN_NERAKA=Sombras em Neraka: Desaparecimentos e cultistas agem nas sombras. Descubra a verdade antes do ritual sombrio.
quest.RESCUE_CAPTIVE_FROM_DARK_QUEEN_CULT=Sacrifício Impedido: Um prisioneiro será sacrificado pelo culto da Rainha Sombria. Impeça o ritual e salve-o.
quest.FETCH_DRAGONLANCE_FRAGMENT=Fragmento Lendário: Recupere um pedaço da Dragonlance em ruínas perigosas, enfrentando monstros e armadilhas.
quest.SOCIALIZE_AT_ELVEN_COURT=Baile Élfico: Participe de um baile na corte élfica, onde alianças e segredos podem mudar o destino dos povos.
quest.EXPLORE_TOMB_OF_HUMA=Tumba de Huma: Aventurando-se na tumba lendária, busque relíquias e enfrente guardiões ancestrais.

