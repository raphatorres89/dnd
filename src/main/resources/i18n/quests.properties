##################################################
# Tavern Quests (TavernQuest)
##################################################
quest.RAT_INFESTATION=Extermination: Bartender offers 5 Silver to clear the cellar of giant rats and twig blights.
quest.DELIVER_PACKAGE=Urgent Delivery: Deliver a sealed (and heavy) package to a reclusive Wizard in the Black Forest. Do not ask contents.
quest.RECOVER_STOLEN_ITEM=Shop Robbery: Recover a stolen lucky necklace from a vendor, snatched by a band of Kobolds.
quest.ESCORTE_MERCHANT=Escort Mission: Accompany a nervous merchant for three days travel on the main road.
quest.DEAL_WITH_BANDITS=Bridge Trouble: A small group of bandits is demanding an illegal toll on the bridge to the next town.
quest.INVESTIGATE_HAUNTING=Farm Haunting: A farmer reports strange phenomena on his property and requires investigation.
quest.CLEAR_GOBLIN_CAMP=Clear Camp: A rough map shows the location of a Goblin camp that needs to be cleared.
quest.RESCUE_CAPTIVE=Mine Rescue: A group of Duergar has kidnapped a local miner. A swift rescue is needed.
quest.FIND_MISSING_PERSON=Missing Person: An NPC (e.g., The Tavern Bard) has been missing for three days. Last seen near the Shadowed Forest.
quest.HUNT_LOCAL_MONSTER=The Hunt: Eliminate a wild animal (e.g., Enraged Boar, Owlbear) that is attacking livestock in the area.
quest.MAP_FRAGMENT=Map Fragment: A patron has a piece of an ancient map and offers a chance to track down the rest.
quest.GUARD_ARTIFACT=Guard Artifact: A Cleric needs protection while transporting a relic to the main temple.
quest.TRUCE_NEGOTIATION=Negotiation: Act as a mediator in a tense truce between two neighboring tribes.

# Dragonlance Quests
quest.DEFEND_SOLAMNIA_VILLAGE=Urgent Defense: Villagers of Solamnia seek help to repel monsters that attack at night and threaten their homes.
quest.ESCORT_SILVANESTI_REFUGEE=Silent Escape: Escort a wounded Silvanesti elf through dangerous trails to a safe refuge while avoiding hostile patrols.
quest.FETCH_WAYRETH_COMPONENT=Rare Component: A mage requires a special ingredient from the forests of Wayreth to complete a vital ritual.
quest.INVESTIGATE_MISSING_KENDER=Missing Kender: A young kender vanished after exploring ancient ruins. Discover their whereabouts before it is too late.
quest.DELIVER_MESSAGE_TO_QUALINESTI=Secret Message: Deliver an urgent letter to the elven council of Qualinesti while evading spies and dangers along the road.
quest.CLEAR_HOBGOBLIN_DEN=Hobgoblin Den: Merchants fear constant attacks; clear the den and restore peace to the trade route.
quest.RESCUE_PRISONER_FROM_OGRE=Rescue in the Hills: An ogre has captured a villager. Storm the cave and bring the prisoner back safely.
quest.EXPLORE_OLD_TOWER_OF_HIGH_SORCERY=Ancient Secrets: An abandoned Tower of High Sorcery holds dangers, riddles, and forgotten artifacts.
quest.DEFEND_TEMPLE_OF_PALADINE=Temple Under Siege: Cultists and undead threaten the Temple of Paladine. Defend the faithful and the sacred relic.
quest.HUNT_WHITE_DRAGON_WHELP=Dragon Whelp: A young white dragon has been spotted in the mountains, terrorizing nearby villages.
quest.ESCORT_MAGE_TO_WAYRETH=Arcane Journey: Protect a mage and their artifact during the journey to the Tower of Wayreth.
quest.INVESTIGATE_CURSED_FOREST=Cursed Forest: Strange disappearances and corrupted creatures haunt the woods. Uncover the source of the curse.
quest.RESCUE_CHILD_FROM_BLOODED_WOLVES=Urgent Rescue: A child has been taken by bloodthirsty wolves. Follow the tracks and rescue them before nightfall.
quest.FETCH_HEALING_HERBS_FOR_HEALER=Vital Herbs: A healer needs rare herbs from a dangerous swamp to save lives in the village.
quest.SOCIALIZE_AT_SOLACE_INN=Night in Solace: Attend an event at the Inn of Solace, where rumors, alliances, and intrigue intertwine.
quest.DEFEND_CARAVAN_FROM_BANDITS=Caravan in Peril: Bandits ambush a merchant caravan. Defend the travelers and their goods.
quest.HUNT_GIANT_OWL_IN_DARKEN_WOOD=Giant Owl: A monstrous owl haunts Darken Wood, frightening all who pass through.
quest.ESCORT_PRIESTESS_TO_XAK_TSAROTH=Sacred Mission: Escort a priestess to the ruins of Xak Tsaroth, facing ancient dangers along the way.
quest.INVESTIGATE_LOST_ARTIFACT_IN_ICELANDER=Lost Artifact: A magical item has disappeared in the frozen lands of Icelander. Brave the cold and recover it.
quest.RESCUE_ELVEN_SCOUTS=Scouts in Danger: Elven scouts sent on a mission have vanished in hostile territory. Organize a rescue before it is too late.
quest.EXPLORE_RUINS_OF_ITHINCART=Forgotten Ruins: Explore Ithincart in search of relics and secrets guarded by monsters and ancient magic.
quest.DEFEND_TOWN_FROM_BLACK_DRAGON=Dragon on the Loose: A black dragon and its minions attack the town. Organize the defense and save the citizens.
quest.HUNT_MINOTAUR_GLADIATOR=Fugitive Gladiator: A minotaur has escaped the arenas and terrorizes villages. Capture or defeat the beast.
quest.ESCORT_KNIGHT_TO_HIGHCLERIC_TOWER=Honored Escort: A knight must reach the High Clerist's Tower safely while facing ambushes along the way.
quest.INVESTIGATE_SHADOWS_IN_NERAKA=Shadows in Neraka: Disappearances and cultists operate in the shadows. Uncover the truth before the dark ritual is completed.
quest.RESCUE_CAPTIVE_FROM_DARK_QUEEN_CULT=Prevent the Sacrifice: A prisoner is to be sacrificed by the cult of the Dark Queen. Stop the ritual and save them.
quest.FETCH_DRAGONLANCE_FRAGMENT=Legendary Fragment: Recover a fragment of the Dragonlance from dangerous ruins filled with monsters and traps.
quest.SOCIALIZE_AT_ELVEN_COURT=Elven Ball: Attend a grand ball at the elven court, where alliances and secrets may shape the fate of nations.
quest.EXPLORE_TOMB_OF_HUMA=Tomb of Huma: Venture into the legendary tomb to seek relics and face ancestral guardians.

