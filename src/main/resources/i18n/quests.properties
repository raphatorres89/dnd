##################################################
# Tavern Quests (TavernQuest)
##################################################
quest.RAT_INFESTATION=Extermination: Bartender offers 5 Silver to clear the cellar of giant rats and twig blights.
quest.DELIVER_PACKAGE=Urgent Delivery: Deliver a sealed (and heavy) package to a reclusive Wizard in the Black Forest. Do not ask contents.
quest.RECOVER_STOLEN_ITEM=Shop Robbery: Recover a stolen lucky necklace from a vendor, snatched by a band of Kobolds.
quest.ESCORTE_MERCHANT=Escort Mission: Accompany a nervous merchant for three days travel on the main road.
quest.DEAL_WITH_BANDITS=Bridge Trouble: A small group of bandits is demanding an illegal toll on the bridge to the next town.
quest.INVESTIGATE_HAUNTING=Farm Haunting: A farmer reports strange phenomena on his property and requires investigation.
quest.CLEAR_GOBLIN_CAMP=Clear Camp: A rough map shows the location of a Goblin camp that needs to be cleared.
quest.RESCUE_CAPTIVE=Mine Rescue: A group of Duergar has kidnapped a local miner. A swift rescue is needed.
quest.FIND_MISSING_PERSON=Missing Person: An NPC (e.g., The Tavern Bard) has been missing for three days. Last seen near the Shadowed Forest.
quest.HUNT_LOCAL_MONSTER=The Hunt: Eliminate a wild animal (e.g., Enraged Boar, Owlbear) that is attacking livestock in the area.
quest.MAP_FRAGMENT=Map Fragment: A patron has a piece of an ancient map and offers a chance to track down the rest.
quest.GUARD_ARTIFACT=Guard Artifact: A Cleric needs protection while transporting a relic to the main temple.
quest.TRUCE_NEGOTIATION=Negotiation: Act as a mediator in a tense truce between two neighboring tribes.

quest.RAT_INFESTATION.title.en=Rat Infestation
quest.RAT_INFESTATION.summary.en=Giant rats have taken over a local merchant’s storage cellar.
quest.RAT_INFESTATION.description.en=A desperate merchant reports that dog-sized rats have infested his warehouse cellar. Workers refuse to enter and goods are spoiling. The merchant fears something is controlling the creatures.
quest.RAT_INFESTATION.location.en=Damp warehouse cellar with broken crates, water puddles, and burrow holes.
quest.RAT_INFESTATION.factions.en=Merchants' Guild; Local Workers Union
quest.RAT_INFESTATION.npcs.en=Joren, Desperate Merchant; Mila, Workers’ Representative
quest.RAT_INFESTATION.hooks.en=Rats show strange intelligence; rumors of a corrupted druid nearby; a larger creature lurks deeper inside.
quest.RAT_INFESTATION.rewards.en=5–10 gold pieces, supplies, merchant discounts
quest.RAT_INFESTATION.enemies.en=Giant Rats; Alpha Mutant Rat; Corrupted Druid (optional)

quest.DELIVER_PACKAGE.title.en=Urgent Delivery
quest.DELIVER_PACKAGE.summary.en=A mysterious package must be delivered discreetly.
quest.DELIVER_PACKAGE.description.en=A nervous courier seeks help delivering something "extremely important". He refuses to reveal the contents.
quest.DELIVER_PACKAGE.location.en=Busy trade routes; suspicious alleys; guard checkpoints
quest.DELIVER_PACKAGE.factions.en=Couriers’ Guild; City Guard; Local Thieves
quest.DELIVER_PACKAGE.npcs.en=Eldric, Nervous Courier; Captain Varas, City Guard Officer
quest.DELIVER_PACKAGE.hooks.en=Guards inspect suspicious goods; thieves attack; package vibrates/whispers
quest.DELIVER_PACKAGE.rewards.en=3–15 GP, guild favor
quest.DELIVER_PACKAGE.enemies.en=Bandits; Street Thieves; Arcane Familiar (optional)

quest.RECOVER_STOLEN_ITEM.title.en=Stolen Item
quest.RECOVER_STOLEN_ITEM.summary.en=A valuable object was stolen and must be retrieved.
quest.RECOVER_STOLEN_ITEM.description.en=A respected craftsman had a unique creation stolen. The thief moved with unnatural speed.
quest.RECOVER_STOLEN_ITEM.location.en=Slums, hidden dens, dark docks
quest.RECOVER_STOLEN_ITEM.factions.en=Craftsmen Guild; Thieves Guild
quest.RECOVER_STOLEN_ITEM.npcs.en=Marven, Smith; “Silk”, Enchanted Thief
quest.RECOVER_STOLEN_ITEM.hooks.en=Item is magical; thieves make counter-offer; item cursed
quest.RECOVER_STOLEN_ITEM.rewards.en=Custom weapon; 10–25 GP
quest.RECOVER_STOLEN_ITEM.enemies.en=Enchanted Thief; Henchmen; Forge Spirit (optional)

quest.ESCORTE_MERCHANT.title.en=Merchant Escort
quest.ESCORTE_MERCHANT.summary.en=A merchant needs armed protection on the road.
quest.ESCORTE_MERCHANT.description.en=A merchant seeks escorts for a nearby city. Bandit activity has increased recently.
quest.ESCORTE_MERCHANT.location.en=Wooded road; side paths; roadside ruins
quest.ESCORTE_MERCHANT.factions.en=Trade Caravans; Road Bandits
quest.ESCORTE_MERCHANT.npcs.en=Torman, Merchant; Lysa, Wounded Guard
quest.ESCORTE_MERCHANT.hooks.en=Cargo is secret; rival sabotage attempt; beast stalks at night
quest.ESCORTE_MERCHANT.rewards.en=Pay, maps, merchant connections
quest.ESCORTE_MERCHANT.enemies.en=Bandits; Wild Beasts; Road Wraiths (optional)

quest.DEAL_WITH_BANDITS.title.en=Deal With Bandits
quest.DEAL_WITH_BANDITS.summary.en=Bandits are attacking travelers near town.
quest.DEAL_WITH_BANDITS.description.en=The town guard captain will pay to remove or negotiate with bandits occupying a key bridge.
quest.DEAL_WITH_BANDITS.location.en=Wooden bridge, makeshift camp, nearby caves
quest.DEAL_WITH_BANDITS.factions.en=Town Guard; Seven Daggers Band
quest.DEAL_WITH_BANDITS.npcs.en=Captain Irven; “Black Dagger”, Bandit Leader
quest.DEAL_WITH_BANDITS.hooks.en=Bandits seek amnesty; some are displaced villagers; spy in the guard
quest.DEAL_WITH_BANDITS.rewards.en=Gold, confiscated weapons, city favor
quest.DEAL_WITH_BANDITS.enemies.en=Bandits; Trained Wolf; Shadow Scout (optional)