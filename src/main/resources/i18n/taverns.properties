##################################################
# Tavern Quests (TavernQuest)
##################################################
tavern.quest.RAT_INFESTATION=Extermination: Bartender offers 5 Silver to clear the cellar of giant rats and twig blights.
tavern.quest.DELIVER_PACKAGE=Urgent Delivery: Deliver a sealed (and heavy) package to a reclusive Wizard in the Black Forest. Do not ask contents.
tavern.quest.RECOVER_STOLEN_ITEM=Shop Robbery: Recover a stolen lucky necklace from a vendor, snatched by a band of Kobolds.
tavern.quest.ESCORTE_MERCHANT=Escort Mission: Accompany a nervous merchant for three days travel on the main road.
tavern.quest.DEAL_WITH_BANDITS=Bridge Trouble: A small group of bandits is demanding an illegal toll on the bridge to the next town.
tavern.quest.INVESTIGATE_HAUNTING=Farm Haunting: A farmer reports strange phenomena on his property and requires investigation.
tavern.quest.CLEAR_GOBLIN_CAMP=Clear Camp: A rough map shows the location of a Goblin camp that needs to be cleared.
tavern.quest.RESCUE_CAPTIVE=Mine Rescue: A group of Duergar has kidnapped a local miner. A swift rescue is needed.
tavern.quest.FIND_MISSING_PERSON=Missing Person: An NPC (e.g., The Tavern Bard) has been missing for three days. Last seen near the Shadowed Forest.
tavern.quest.HUNT_LOCAL_MONSTER=The Hunt: Eliminate a wild animal (e.g., Enraged Boar, Owlbear) that is attacking livestock in the area.
tavern.quest.MAP_FRAGMENT=Map Fragment: A patron has a piece of an ancient map and offers a chance to track down the rest.
tavern.quest.GUARD_ARTIFACT=Guard Artifact: A Cleric needs protection while transporting a relic to the main temple.
tavern.quest.TRUCE_NEGOTIATION=Negotiation: Act as a mediator in a tense truce between two neighboring tribes.