# Tavern Rumors
tavern.rumor.LOCAL_LORD_CORRUPT=I heard the local Lord is secretly selling lumber from the sacred woods to the Drow.
tavern.rumor.SECRET_PASSAGE=They say there's a secret tunnel linking the tavern well to the old dungeon beneath the castle.
tavern.rumor.STRANGE_CULT_SIGHTED=A strange cult of black-hooded figures was seen gathering near the ruins on the hill.
tavern.rumor.OLD_MINE_ACTIVE=The old silver mine, abandoned for years, is showing signs of activity and strange lights.
tavern.rumor.GHOST_IN_THE_WELL=A fisherman claims to have seen the ghost of a drowned bride in the village well at dusk.
tavern.rumor.KING_IS_ILL=The King hasn't been seen in public for months. The rumor is he is deathly ill, or worse.
tavern.rumor.DRAGON_AWAKENS=The Drunken Hunter insists he saw dragon smoke (or was it cigar smoke?) coming from the Flaming Mountain.
tavern.rumor.LOST_RELIC_FOUND=Someone claims to have found the Lost Blade of Bahamut, but hid it under their mattress.
tavern.rumor.GUILD_WAR_BEGINS=The Thieves' Guild and the Merchants' Guild are about to engage in open warfare in the capital.
tavern.rumor.NEW_EVIL_RISES=The world is shaking. Is it the new Avatar of Evil rising, or just a silly earthquake?
tavern.rumor.TAVERN_GHOST=The Bartender swears the old cook's ghost complains about the beer quality in the kitchen every night.
tavern.rumor.BARD_IS_VAMPIRE=That charming, but pale bard? He never drinks ale and only comes out at night. He must be a vampire.
tavern.rumor.TREASURE_MAP_PIECE=An old coin at the bottom of a mug has strange symbols, which look like part of a treasure map.

# A. Adventure/Combat
tavern.rumor.GOBLIN_RAID=A goblin war band is gathering near the river crossing, robbing all travelers.
tavern.rumor.SKELETON_ARMY=They say skeletons are marching out of the old King's graveyard every night.
tavern.rumor.LOST_RELIC_MAP=A map to a forgotten holy relic was sold in the market this morning for almost nothing.
tavern.rumor.MINE_MONSTER=The Silver Mine had to shut down because a beast is hunting the workers deep inside.
tavern.rumor.BANDIT_HIDEOUT=The local bandits hide their loot in a cave behind the Great Waterfall.
tavern.rumor.WEREWOLF_HUNTER=A desperate farmer is looking for a hunter who can track a creature that killed his livestock.
tavern.rumor.GIANT_SPIDER_WEB=The old Elven road is now blocked by massive spider webs. No one dares to clear it.
tavern.rumor.CULT_MEETING=A sinister cult meets every full moon in the catacombs under the Grand Cathedral.
tavern.rumor.ABANDONED_TOWER=Lights were seen in the abandoned Wizard's Tower for the first time in a century.
tavern.rumor.DRAGON_SIGHTING=A traveler swore they saw a young red dragon flying over the northern peaks.

# B. Local/Investigation
tavern.rumor.CORRUPT_GUARD=The head of the city guard is taking bribes from the Thieves' Guild to ignore certain streets.
tavern.rumor.MAYOR_POISONED=The Mayor is not sick; the Royal Advisor has been poisoning his tea slowly.
tavern.rumor.WATER_WELL_SICKNESS=The water from the central well is making people sick, but the priests deny it.
tavern.rumor.MERCHANT_SCAM=A traveling merchant is selling fake healing potions and plans to leave town tonight.
tavern.rumor.CHILDREN_VANISHED=Three children vanished from the docks. They say it was the work of the Fey.
tavern.rumor.FORBIDDEN_BOOKS=Someone smuggled a shipment of forbidden magical texts into the library this week.
tavern.rumor.CRYPT_OPENED=The stone door of the oldest crypt outside the city has been mysteriously pried open.
tavern.rumor.FARMER_TREASURE=Old Farmer Giles found a huge chest of gold, but he’s hiding it from everyone.
tavern.rumor.GOSSIP_MONK=Brother Thomas, the quietest monk, knows the deepest secrets of every noble family.
tavern.rumor.MISSING_GUARD_PATROL=A routine guard patrol disappeared three days ago; the Captain is keeping it quiet.

# C. Mystery/World Plot
tavern.rumor.ANCIENT_GOD_WOKE=Whispers say the mountain shook because an ancient, forgotten god is stirring beneath the roots.
tavern.rumor.MAGIC_FAILURES=Magic items have been malfunctioning strangely ever since the comet passed overhead.
tavern.rumor.TIME_STOPPED_FOREST=There is a clearing deep in the forest where time has stopped; nothing moves there.
tavern.rumor.PROPHET_ARRIVED=A prophet claiming the world will end in 40 days arrived this morning and is preaching in the square.
tavern.rumor.FALLEN_STAR_GLOWS=The piece of the fallen star in the museum is starting to glow and hum faintly.
tavern.rumor.DRUIDS_MOURNING=The local druids are in deep mourning because the oldest tree in the region died overnight.
tavern.rumor.NEW_RACE_SIGHTED=A strange, small race of creatures has been sighted trading in the deep South.
tavern.rumor.KING_IS_IMPOSTER=The King died months ago, and the person on the throne is a shapeshifting creature.
tavern.rumor.GHOST_SHIP_APPEARED=A fully crewed ghost ship appeared on the lake last night, sailing without wind.
tavern.rumor.SECRET_ORDER_ACTIVATED=The ancient Secret Order of the Silver Hand has suddenly become active after centuries of silence.

