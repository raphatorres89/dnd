damage.ACID=Acid
damage.desc.ACID=The corrosive spray of a black dragon's breath and the dissolving enzymes secreted by a black pudding deal acid damage.
damage.BLUDGEONING=Bludgeoning
damage.desc.BLUDGEONING=Blunt force attacks, falling, constriction, and the like deal bludgeoning damage.
damage.COLD=Cold
damage.desc.COLD=The infernal chill radiating from an ice devil's spear and the frigid blast of a white dragon's breath deal cold damage.
damage.FIRE=Fire
damage.desc.FIRE=Red dragons breathe fire, and many spells conjure flames to deal fire damage.
damage.FORCE=Force
damage.desc.FORCE=Force is pure magical energy focused into a damaging form. Most effects that deal force damage are spells, including magic missile and spiritual weapon.
damage.LIGHTNING=Lightning
damage.desc.LIGHTNING=A lightning bolt spell and a blue dragon's breath deal lightning damage.
damage.NECROTIC=Necrotic
damage.desc.NECROTIC=Necrotic damage, dealt by certain undead and a spell such as chill touch, withers matter and even the soul.
damage.PIERCING=Piercing
damage.desc.PIERCING=Puncturing and impaling attacks, including spears and monsters' bites, deal piercing damage.
damage.POISON=Poison
damage.desc.POISON=Venomous stings and the toxic gas of a green dragon's breath deal poison damage.
damage.PSYCHIC=Psychic
damage.desc.PSYCHIC=Mental abilities such as a psionic blast deal psychic damage.
damage.RADIANT=Radiant
damage.desc.RADIANT=Radiant damage, dealt by a cleric's flame strike spell or an angel's smiting weapon, sears the flesh like fire and overloads the spirit with power.
damage.SLASHING=Slashing
damage.desc.SLASHING=Swords, axes, and monsters' claws deal slashing damage.
damage.THUNDER=Thunder
damage.desc.THUNDER=A concussive burst of sound, such as the effect of the thunderwave spell, deals thunder damage.
damage.DAMAGE_FROM_SPELLS=Damage from Spells
damage.desc.DAMAGE_FROM_SPELLS=Spells and magical effects cause this type of damage.

