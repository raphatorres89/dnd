# Rumores
tavern.rumor.LOCAL_LORD_CORRUPT=Ouvi dizer que o Lorde local está secretamente vendendo madeira dos bosques sagrados para Drows.
tavern.rumor.SECRET_PASSAGE=Dizem que há um túnel secreto ligando o poço da taverna à antiga masmorra sob o castelo.
tavern.rumor.STRANGE_CULT_SIGHTED=Um culto estranho de capuzes negros foi visto se reunindo perto das ruínas da colina.
tavern.rumor.OLD_MINE_ACTIVE=A velha mina de prata, abandonada há anos, está mostrando sinais de atividade e luzes estranhas.
tavern.rumor.GHOST_IN_THE_WELL=Um pescador alega ter visto o fantasma de uma noiva afogada no poço da aldeia ao entardecer.
tavern.rumor.KING_IS_ILL=O rei não aparece em público há meses. O rumor é que ele está mortalmente doente, ou pior.
tavern.rumor.DRAGON_AWAKENS=O Caçador Bêbado insiste que viu fumaça de dragão (ou era fumaça de charuto?) vindo da Montanha Flamejante.
tavern.rumor.LOST_RELIC_FOUND=Alguém afirma ter encontrado a Lâmina Perdida de Bahamut, mas a escondeu debaixo do seu colchão.
tavern.rumor.GUILD_WAR_BEGINS=A Guilda dos Ladrões e a Guilda dos Comerciantes estão prestes a entrar em guerra aberta na capital.
tavern.rumor.NEW_EVIL_RISES=O mundo está tremendo. É o novo Avatar do Mal se levantando, ou foi só um terremoto bobo?
tavern.rumor.TAVERN_GHOST=O Barman jura que o fantasma do antigo cozinheiro reclama da qualidade da cerveja toda noite na cozinha.
tavern.rumor.BARD_IS_VAMPIRE=Aquele bardo charmoso, mas pálido? Ele nunca bebe cerveja e só sai à noite. Deve ser um vampiro.
tavern.rumor.TREASURE_MAP_PIECE=Uma moeda velha no fundo de uma caneca tem símbolos estranhos, que parecem ser parte de um mapa de tesouro.

# A. Aventura/Combate
tavern.rumor.GOBLIN_RAID=Um bando de guerra goblin está a reunir-se perto da passagem do rio, roubando todos os viajantes.
tavern.rumor.SKELETON_ARMY=Dizem que esqueletos estão a marchar do antigo cemitério do Rei todas as noites.
tavern.rumor.LOST_RELIC_MAP=Um mapa para uma relíquia sagrada esquecida foi vendido no mercado esta manhã por quase nada.
tavern.rumor.MINE_MONSTER=A Mina de Prata teve de fechar porque uma besta está a caçar os trabalhadores lá no fundo.
tavern.rumor.BANDIT_HIDEOUT=Os bandidos locais escondem o seu saque numa caverna atrás da Grande Cascata.
tavern.rumor.WEREWOLF_HUNTER=Um agricultor desesperado procura um caçador que consiga seguir uma criatura que matou o seu gado.
tavern.rumor.GIANT_SPIDER_WEB=A antiga estrada Élfica está agora bloqueada por teias de aranha gigantes. Ninguém se atreve a limpá-la.
tavern.rumor.CULT_MEETING=Um culto sinistro reúne-se em todas as luas cheias nas catacumbas sob a Grande Catedral.
tavern.rumor.ABANDONED_TOWER=Luzes foram vistas na Torre do Mago abandonada pela primeira vez num século.
tavern.rumor.DRAGON_SIGHTING=Um viajante jurou que viu um jovem dragão vermelho a voar sobre os picos do Norte.

# B. Local/Investigação
tavern.rumor.CORRUPT_GUARD=O chefe da guarda da cidade está a aceitar subornos da Guilda de Ladrões para ignorar certas ruas.
tavern.rumor.MAYOR_POISONED=O Prefeito não está doente; o Conselheiro Real tem estado a envenenar o seu chá lentamente.
tavern.rumor.WATER_WELL_SICKNESS=A água do poço central está a adoecer as pessoas, mas os sacerdotes negam.
tavern.rumor.MERCHANT_SCAM=Um mercador viajante está a vender poções de cura falsas e planeia deixar a cidade esta noite.
tavern.rumor.CHILDREN_VANISHED=Três crianças desapareceram dos cais. Dizem que foi obra das Fadas.
tavern.rumor.FORBIDDEN_BOOKS=Alguém contrabandeou uma remessa de textos mágicos proibidos para a biblioteca esta semana.
tavern.rumor.CRYPT_OPENED=A porta de pedra da cripta mais antiga fora da cidade foi misteriosamente aberta.
tavern.rumor.FARMER_TREASURE=O Velho Agricultor Giles encontrou um enorme baú de ouro, mas está a escondê-lo de todos.
tavern.rumor.GOSSIP_MONK=O Irmão Thomas, o monge mais silencioso, sabe os segredos mais profundos de todas as famílias nobres.
tavern.rumor.MISSING_GUARD_PATROL=Uma patrulha de guarda de rotina desapareceu há três dias; o Capitão está a manter segredo.

# C. Mistério/Grandes Ganchos de Plot
tavern.rumor.ANCIENT_GOD_WOKE=Murmúrios dizem que a montanha tremeu porque um deus antigo e esquecido está a despertar sob as raízes.
tavern.rumor.MAGIC_FAILURES=Itens mágicos estão a falhar estranhamente desde que o cometa passou.
tavern.rumor.TIME_STOPPED_FOREST=Há uma clareira no fundo da floresta onde o tempo parou; nada se move lá.
tavern.rumor.PROPHET_ARRIVED=Um profeta que alega que o mundo acabará em 40 dias chegou esta manhã e está a pregar na praça.
tavern.rumor.FALLEN_STAR_GLOWS=O pedaço da estrela caída no museu começou a brilhar e a zumbir fracamente.
tavern.rumor.DRUIDS_MOURNING=Os druidas locais estão de luto profundo porque a árvore mais antiga da região morreu durante a noite.
tavern.rumor.NEW_RACE_SIGHTED=Uma estranha e pequena raça de criaturas foi avistada negociando no extremo sul.
tavern.rumor.KING_IS_IMPOSTER=O Rei morreu há meses, e a pessoa no trono é uma criatura que muda de forma.
tavern.rumor.GHOST_SHIP_APPEARED=Um navio fantasma totalmente tripulado apareceu no lago na noite passada, a navegar sem vento.
tavern.rumor.SECRET_ORDER_ACTIVATED=A antiga Ordem Secreta da Mão de Prata renasceu subitamente após séculos de silêncio.

