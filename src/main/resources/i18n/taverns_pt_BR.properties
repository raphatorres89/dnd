# Quests de Taverna (TavernQuest)
##################################################
tavern.quest.RAT_INFESTATION=Extermínio: Barman oferece 5 Pratas para limpar o porão de ratos gigantes e *blights* de galho.
tavern.quest.DELIVER_PACKAGE=Entrega Urgente: Entregar um pacote selado (e pesado) a um Magista recluso na Floresta Negra. Não perguntar o conteúdo.
tavern.quest.RECOVER_STOLEN_ITEM=Roubo na Loja: Recuperar um colar da sorte roubado de um vendedor por um bando de Kobolds.
tavern.quest.ESCORTE_MERCHANT=Missão de Escolta: Acompanhar um comerciante medroso por três dias de viagem na estrada principal.
tavern.quest.DEAL_WITH_BANDITS=Problema na Ponte: Um pequeno grupo de bandidos está cobrando pedágio ilegal na ponte para a cidade vizinha.
tavern.quest.INVESTIGATE_HAUNTING=Assombração na Fazenda: Um fazendeiro relata fenômenos estranhos em sua fazenda e precisa de uma investigação.
tavern.quest.CLEAR_GOBLIN_CAMP=Limpar Acampamento: Um mapa rudimentar mostra a localização de um acampamento Goblin a ser eliminado.
tavern.quest.RESCUE_CAPTIVE=Resgate na Mina: Um grupo de Duergar raptou um mineiro local. O resgate deve ser rápido.
tavern.quest.FIND_MISSING_PERSON=Pessoa Desaparecida: Um NPC (ex: O Bardo da Taverna) está desaparecido há três dias. Última pista: a Floresta Sombria.
tavern.quest.HUNT_LOCAL_MONSTER=Caça: Eliminar um animal selvagem (ex: Javali Enraivecido, Urso Coruja) que está atacando gado na região.
tavern.quest.MAP_FRAGMENT=Fragmento de Mapa: Um cliente tem um pedaço de um mapa antigo e oferece a chance de juntar o resto.
tavern.quest.GUARD_ARTIFACT=Proteger Artefato: Um Clérigo precisa de proteção ao transportar uma relíquia até o templo principal.
tavern.quest.TRUCE_NEGOTIATION=Negociação: Agir como mediador em uma trégua tensa entre duas tribos vizinhas.